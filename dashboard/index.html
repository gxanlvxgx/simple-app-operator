<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimpleApp Dashboard</title>
    <style>
        /* General layout to support two cards in column */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 30px; 
            padding-bottom: 50px;
        }
        
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 600px;
            margin-bottom: 14px; 
        }

        .card.list-card {
            width: 920px;
            max-width: calc(100vw - 80px);
        }

        h1 { color: #2c3e50; text-align: center; margin-bottom: 10px; border-bottom: none; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 0.95em; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #555; }
        input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        input:invalid { border-color: #e74c3c; }
        
        button.btn-deploy { width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.btn-deploy:hover { background-color: #2980b9; transform: translateY(-2px); }
        button.btn-deploy:disabled { background-color: #bdc3c7; cursor: not-allowed; transform: none; }
        
        .result-container { margin-top: 30px; display: none; }
        .result { padding: 20px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; background-color: #ecf0f1; border-left: 5px solid #bdc3c7; max-height: 400px; overflow-y: auto; word-wrap: break-word; overflow-x: auto; }
        .success { border-left-color: #27ae60; background-color: #e8f8f5; color: #0e6655; }
        .error { border-left-color: #c0392b; background-color: #fdedec; color: #922b21; }
        
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .app-grid {
            margin-top: 14px;
        }

        .app-grid-head,
        .app-row {
            display: grid;
            grid-template-columns: minmax(120px, 1.1fr) minmax(100px, 0.9fr) minmax(170px, 1.55fr) 84px 128px 92px;
            gap: 12px;
            align-items: center;
        }

        .app-grid-head {
            padding: 0 10px 12px 10px;
            color: #637085;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .app-row {
            background: #fbfcfe;
            border: 1px solid #e7ebf2;
            border-radius: 14px;
            padding: 16px 12px;
            margin-bottom: 10px;
            font-size: 0.96rem;
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.02);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .app-row:hover {
            transform: translateY(-1px);
            border-color: #d8deea;
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
        }

        .app-row .name {
            font-weight: 700;
            color: #1f2937;
        }

        .app-row .namespace {
            color: #64748b;
            font-size: 0.92rem;
        }

        .app-image {
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: monospace;
            font-size: 0.92rem;
            color: #334155;
            background: #eef2f7;
            border: 1px solid #dde4ee;
            border-radius: 10px;
            padding: 7px 10px;
        }

        .replicas {
            font-variant-numeric: tabular-nums;
            color: #334155;
            font-weight: 600;
        }
        
        .btn-delete { 
            background-color: white; 
            color: #e74c3c; 
            border: 1px solid #e74c3c; 
            padding: 7px 13px; 
            border-radius: 999px; 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .btn-delete:hover { background-color: #e74c3c; color: white; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.72em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            background: transparent;
            border: 1px solid currentColor;
        }
        .status-running { color: #1f7a3e; }
        .status-pending { color: #8a6500; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-refresh { background: none; border: none; color: #3498db; cursor: pointer; font-size: 0.9rem; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SimpleApp Dashboard</h1>
        <p class="subtitle">Manage your application lifecycle</p>
        
        <form id="deployForm">
            <div class="form-group">
                <label>Application Name</label>
                <input type="text" name="name" placeholder="e.g. my-webapp" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" title="Use only lowercase letters, numbers and hyphens." required>
            </div>

            <div class="form-group">
                <label>Kubernetes Namespace</label>
                <input type="text" name="namespace" value="default" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" title="Use only lowercase letters and numbers." required>
            </div>
            
            <div class="form-group">
                <label>Docker Image</label>
                <input type="text" name="image" placeholder="e.g. nginx:latest" required>
            </div>

            <div class="form-group">
                <label>Replicas</label>
                <input type="number" name="replicas" value="1" min="1" required>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Container Port</label>
                    <input type="number" name="containerPort" value="80" min="1" max="65535" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Service Port</label>
                    <input type="number" name="servicePort" value="8080" min="1" max="65535" required>
                </div>
            </div>
            
            <button type="submit" id="submitBtn" class="btn-deploy">
                <span id="btnText">Deploy App</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div id="resultArea" class="result-container"></div>
    </div>

    <div class="card list-card">
        <div class="header-row">
            <h2 style="margin:0; font-size: 1.3rem; color: #2c3e50;">Active Applications</h2>
            <button class="btn-refresh" onclick="fetchApps()">Refresh List</button>
        </div>

        <div class="app-grid-head">
            <div>Name</div>
            <div>Namespace</div>
            <div>Image</div>
            <div>Replicas</div>
            <div>Status</div>
            <div style="text-align: right;">Actions</div>
        </div>
        <div class="app-grid" id="app-list-body"></div>
        <div id="loading-msg" style="text-align:center; padding: 20px; color:#777; display:none;">Loading...</div>
    </div>

<script>
    // Form handling (creation)
    document.getElementById('deployForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 

        const btn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const resultArea = document.getElementById('resultArea');

        btn.disabled = true;
        btnText.style.display = 'none';
        spinner.style.display = 'block';
        resultArea.style.display = 'none';
        resultArea.innerHTML = '';

        try {
            const formData = new FormData(this);
            const response = await fetch('/', {
                method: 'POST',
                body: formData
            });

            const text = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'text/html');
            const resultDiv = doc.querySelector('.result');
            
            if (resultDiv) {
                resultDiv.style.display = 'block';
                resultArea.appendChild(resultDiv);
                resultArea.style.display = 'block';
                
                // If deploy succeeds, refresh the list
                if(resultDiv.classList.contains('success')) {
                    // Wait 1 second to give K8s time to create the resource
                    setTimeout(fetchApps, 1000); 
                }
            } else {
                resultArea.innerHTML = '<div class="result error"><strong>Error:</strong> Unexpected server response.</div>';
                resultArea.style.display = 'block';
            }

        } catch (err) {
            resultArea.innerHTML = `<div class="result error"><strong>Connection Error:</strong> ${err.message}</div>`;
            resultArea.style.display = 'block';
        } finally {
            btn.disabled = false;
            btnText.style.display = 'block';
            spinner.style.display = 'none';
        }
    });

    // List management (display and deletion)
    function fetchApps() {
        const tbody = document.getElementById('app-list-body');
        const loader = document.getElementById('loading-msg');
        
        tbody.innerHTML = '';
        loader.style.display = 'block';

        fetch('/api/list')
            .then(res => {
                if(!res.ok) throw new Error("API Error");
                return res.json();
            })
            .then(data => {
                loader.style.display = 'none';
                
                if (!data.items || data.items.length === 0) {
                    tbody.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">No SimpleApp applications found.</div>';
                    return;
                }

                data.items.forEach(app => {
                    const name = app.metadata.name;
                    const ns = app.metadata.namespace;
                    const img = app.spec.image;
                    const replicas = Number(app.spec.replicas ?? 0);
                    const readyReplicas = Number(app.status?.readyReplicas ?? 0);
                    const isHealthy = replicas > 0 && readyReplicas >= replicas;

                    const status = isHealthy
                        ? `Healthy ${readyReplicas}/${replicas}`
                        : `Degraded ${readyReplicas}/${replicas}`;
                    const statusClass = isHealthy ? 'status-running' : 'status-pending';

                    const row = document.createElement('div');
                    row.className = 'app-row';
                    row.innerHTML = `
                        <div class="name">${name}</div>
                        <div class="namespace">${ns}</div>
                        <div title="${img}"><span class="app-image">${img}</span></div>
                        <div class="replicas">${replicas}</div>
                        <div><span class="status-badge ${statusClass}">${status}</span></div>
                        <div style="text-align: right;">
                            <button class="btn-delete" onclick="deleteApp('${name}', '${ns}')">Delete</button>
                        </div>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => {
                loader.style.display = 'none';
                console.error(err);
                tbody.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">Unable to load list (Backend API unavailable).</div>';
            });
    }

    function deleteApp(name, namespace) {
        if(!confirm(`Are you sure you want to delete the application "${name}"?\nThis action will also delete associated Deployment, Service and Ingress.`)) {
            return;
        }

        fetch(`/api/delete?name=${name}&namespace=${namespace}`, {
            method: 'DELETE'
        })
        .then(response => {
            if (response.ok) {
                fetchApps(); 
            } else {
                response.text().then(text => alert("Error during deletion: " + text));
            }
        })
        .catch(error => alert("Network error: " + error));
    }

    // Load app list on page load
    document.addEventListener('DOMContentLoaded', fetchApps);

</script>

{{ if .Message }}
<div id="server-response" class="result {{ if .Error }}error{{ else }}success{{ end }}" style="display:none;">
    <strong>{{ .Message }}</strong><br><br>
    <pre>{{ .Output }}</pre>
</div>
<script>
    // If page was reloaded by server with a message, display it in the form
    const serverResponse = document.getElementById('server-response');
    if(serverResponse) {
        const area = document.getElementById('resultArea');
        area.innerHTML = '';
        area.appendChild(serverResponse);
        area.style.display = 'block';
        serverResponse.style.display = 'block';
    }
</script>
{{ end }}

</body>
</html>
